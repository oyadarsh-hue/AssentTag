# Deployment is opt-in. This uses paid, non-sleeping compute and a persistent disk.
# Review Render's displayed charges before creating the service.
services:
  - type: web
    name: assenttag-personal-assistant
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: pip install -r requirements-assistant.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT --threads=8 assistant_service:application
    healthCheckPath: /api/assistant/status/
    autoDeployTrigger: commit
    disk:
      name: assistant-limits
      mountPath: /var/data/assistant
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ASSISTANT_ACCESS_CODE
        generateValue: true
      - key: ASSISTANT_ALLOWED_ORIGINS
        value: https://oyadarsh-hue.github.io
      - key: ASSISTANT_LIMITS_PATH
        value: /var/data/assistant/limits.sqlite3
      - key: ASSISTANT_HOURLY_LIMIT
        value: "20"
      - key: ASSISTANT_DAILY_LIMIT
        value: "150"
