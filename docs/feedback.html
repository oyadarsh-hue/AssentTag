<!DOCTYPE html>
<html lang="en">
<head>
<script src="demo-adapter.js"></script>
    <meta charset="UTF-8">
    <title>Post Feedback - AssentTag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --magenta: #ff00ff;
            --orange: #ff6600;
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark); color: #fff; min-height: 100vh;
            background: linear-gradient(rgba(5,5,10,0.85), rgba(5,5,10,0.85)), url('static/assets/user_bg.jpg') center/cover fixed;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Top Navigation Bar */
        .glass-nav {
            background: rgba(10,10,14,0.9); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 4%;
            display: flex; justify-content: space-between; align-items: center; height: 80px; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
        }

        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 35px; animation: pulseGlow 3s infinite alternate; filter: drop-shadow(0 0 5px var(--neon-blue)); }
        @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 5px var(--neon-blue)); transform: scale(1); } 100% { filter: drop-shadow(0 0 15px var(--neon-blue)); transform: scale(1.05); } }
        .logo-text { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.2rem; color: #fff; text-transform: uppercase; letter-spacing: 1px;}

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-btn { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 16px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .nav-btn:hover { background: rgba(0,243,255,0.1); box-shadow: 0 0 10px rgba(0,243,255,0.2); }
        .profile-wrap { display: flex; align-items: center; gap: 10px; }
        .profile-name { font-size: 0.85rem; font-weight: 700; color: #fff; }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--neon-blue); object-fit: cover; }

        /* Central Box */
        .feedback-card {
            background: rgba(15,15,18,0.95); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
            width: 100%; max-width: 600px; padding: 40px; margin-top: 120px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-bottom: 50px;
        }

        .card-header { margin-bottom: 30px; }
        .card-header h2 { font-size: 1.6rem; font-weight: 800; border-left: 3px solid var(--neon-blue); padding-left: 12px; margin-bottom: 8px; }
        .card-header p { font-size: 0.85rem; color: #888; padding-left: 15px; }

        .form-group { margin-bottom: 25px; }
        label { font-size: 0.75rem; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }

        select, textarea {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 14px 15px; border-radius: 8px; font-size: 0.95rem; font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        select:focus, textarea:focus { border-color: var(--magenta); outline: none; box-shadow: 0 0 10px rgba(255,0,255,0.2); }
        select option { background: #111; color: #fff; }

        textarea { resize: vertical; min-height: 120px; }

        /* Rating System */
        .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .rating-box {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 800; color: #fff; cursor: pointer; transition: 0.3s;
        }
        .rating-box:hover { background: rgba(255,255,255,0.1); }
        .rating-box.selected { background: linear-gradient(135deg, var(--magenta), var(--neon-blue)); border-color: transparent; }
        input[type="radio"] { display: none; }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(90deg, #b026ff, #00f3ff); border: none; padding: 18px; width: 100%;
            color: #fff; font-weight: 900; font-size: 1rem; border-radius: 8px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(176,38,255,0.4); margin-top: 15px;
        }
        .btn-submit:hover { filter: brightness(1.2); }

        .footer { padding: 30px; text-align: center; color: #555; font-size: 0.75rem; width: 100%; }

    </style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="static/assets/assenttag-logo.png">
<link rel="stylesheet" href="static/css/visual-experience.css?v=9">
<link rel="stylesheet" href="static/css/color-vibe.css?v=1">
<script src="static/js/visual-experience.js?v=9" defer></script>



<script src="static/js/success-notices.js?v=1" defer></script>

<link rel="stylesheet" href="demo-banner.css"></head>
<body class="at-experience" data-at-scene="feedback" data-at-photo="static/assets/page-feedback.webp">

    <nav class="glass-nav">
        <div class="nav-left">
            <img src="static/assets/assenttag-logo.png" class="logo-img at-brand-mark" onerror="this.style.display='none'">
            <div class="logo-text">AssentTag Feedback</div>
        </div>
        <div class="nav-right">
            <a href="demo.html" class="nav-btn">Back &rarr;</a>
            <div class="profile-wrap">
                <span class="profile-name">Jamie</span>
                <a href="profile.html"><img src="static/assets/user_icon.svg" class="avatar-circle" onerror="this.onerror=null; this.src='static/assets/user_icon.svg';"></a>
            </div>
        </div>
    </nav>

    <div class="feedback-card">
        <section class="at-page-photo" aria-label="Better, with your feedback." data-workflow-image="static/assets/page-feedback.webp">
    <img src="static/assets/page-feedback.webp" alt="Designers reviewing user feedback and ratings together on a real tablet" width="1536" height="1024" decoding="async">
    <div class="at-page-photo-copy"><p class="at-eyebrow">AssentTag</p><h2>Better, with your feedback.</h2><p>Help shape the next chapter of your community.</p></div>
</section>

        <div class="card-header">
            <h2>Share Your Thoughts</h2>
            <p>Help us improve AssentTag by providing your feedback.</p>
        </div>

        <form method="dialog" novalidate data-demo-form>


            <div class="form-group">
                <label>Topic of Feedback</label>
                <select name="topic" required>
                    <option value="" disabled selected>Select a topic...</option>
                    <option value="Bug Report">Bug Report</option>
                    <option value="Feature Request">Feature Request</option>
                    <option value="User Experience">User Experience</option>
                    <option value="Privacy Concern">Privacy Concern</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Comments</label>
                <textarea name="comments" placeholder="Describe your experience or suggestions here..." required></textarea>
            </div>

            <div class="form-group">
                <label>Overall Rating (1-Poor, 5-Excellent)</label>
                <div class="rating-grid">
                    <label class="rating-box">
                        <input type="radio" name="rating" value="1" required>1
                    </label>
                    <label class="rating-box">
                        <input type="radio" name="rating" value="2" required>2
                    </label>
                    <label class="rating-box">
                        <input type="radio" name="rating" value="3" required>3
                    </label>
                    <label class="rating-box">
                        <input type="radio" name="rating" value="4" required>4
                    </label>
                    <label class="rating-box">
                        <input type="radio" name="rating" value="5" required>5
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-submit">SUBMIT FEEDBACK</button>
        </form>
    </div>

    <div class="footer">&copy; 2026 AssentTag Systems</div>

    <script>
        const ratingBoxes = document.querySelectorAll('.rating-box');
        ratingBoxes.forEach(box => {
            const input = box.querySelector('input');
            input.addEventListener('change', () => {
                ratingBoxes.forEach(b => b.classList.remove('selected'));
                if(input.checked) box.classList.add('selected');
            });
        });

        // Normal POST submission displays server-confirmed feedback after redirect.
    </script>
<div class="demo-notice" role="note">UI preview · Sample data <a href="demo.html">Dashboard ↗</a><button type="button" aria-label="Dismiss demo notice" onclick="this.parentElement.remove()">×</button></div></body>
</html>
