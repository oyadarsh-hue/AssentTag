<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>
        <radialGradient id="meshGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#0b1016;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="url(#meshGrad)"/>

    <!-- Large Wireframe Face Mesh (Centered) -->
    <g transform="translate(960, 540) scale(3.5)" stroke="rgba(0, 210, 211, 0.2)" stroke-width="0.5" fill="none">

        <!-- Polygon Mesh Construction (Approximated Face Topology) -->
        <!-- Center Line -->
        <path d="M0 -100 L0 100" />

        <!-- Horizontal Contours -->
        <ellipse cx="0" cy="-40" rx="35" ry="10" /> <!-- Forehead -->
        <ellipse cx="0" cy="0" rx="30" ry="10" /> <!-- Eyes Level -->
        <ellipse cx="0" cy="40" rx="25" ry="12" /> <!-- Nose/Cheek -->
        <ellipse cx="0" cy="70" rx="15" ry="8" /> <!-- Chin -->

        <!-- Vertical Mesh Lines -->
        <path d="M-35 -40 Q-40 0 -25 40" />
        <path d="M35 -40 Q40 0 25 40" />
        <path d="M-15 -60 Q-20 0 -10 70" />
        <path d="M15 -60 Q20 0 10 70" />

        <!-- Triangulation (The "Tech" Look) -->
        <path d="M0 -100 L-35 -40 L0 0 L35 -40 Z" />
        <path d="M-35 -40 L-40 0 L-25 40 L0 70 L25 40 L40 0 L35 -40" />

        <!-- Biometric Nodes (Glowing) -->
        <g fill="#00D2D3" filter="url(#glow)">
            <circle cx="-15" cy="-5" r="1.5" opacity="0.8"/> <!-- Eye L -->
            <circle cx="15" cy="-5" r="1.5" opacity="0.8"/>  <!-- Eye R -->
            <circle cx="0" cy="35" r="1.5" opacity="0.8"/>   <!-- Nose -->
            <circle cx="-12" cy="55" r="1" opacity="0.6"/>   <!-- Mouth L -->
            <circle cx="12" cy="55" r="1" opacity="0.6"/>    <!-- Mouth R -->
            <circle cx="0" cy="70" r="1" opacity="0.6"/>     <!-- Chin -->
        </g>

        <!-- Scanning Box Frame -->
        <rect x="-50" y="-80" width="100" height="160" stroke="rgba(46, 134, 222, 0.5)" stroke-dasharray="10 5" opacity="0.5"/>
        <path d="M-50 -80 L-40 -80 M50 -80 L40 -80 M-50 80 L-40 80 M50 80 L40 80 M-50 -80 L-50 -70 M50 -80 L50 -70 M-50 80 L-50 70 M50 80 L50 70"
              stroke="#00D2D3" stroke-width="2" />

    </g>
</svg>
