    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --magenta: #ff00ff;
            --bg-dark: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            perspective: 1000px;
        }

        /* Go back button */
        .btn-back {
            position: absolute; top: 30px; left: 30px; z-index: 1000;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;
            padding: 10px 20px; border-radius: 30px; text-transform: uppercase; letter-spacing: 1px;
            font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.3s;
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
        }
        .btn-back:hover {
            box-shadow: 0 0 20px rgba(0,243,255,0.4); border-color: var(--neon-blue); color: var(--neon-blue);
        }

        .universe-title {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10;
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-purple); text-align: center;
        }

        /* The 3D Universe Container */
        #universe {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0;
            transform-style: preserve-3d;
            animation: spinUniverse 120s linear infinite;
        }

        .orbit-ring {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotateX(75deg);
            border: 1px dashed rgba(0, 243, 255, 0.15); border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.05) inset;
        }

        @keyframes spinUniverse {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* Ensure avatars face the camera always by counter-rotating */
        .planet-container {
            position: absolute; width: 60px; height: 60px;
            transform-style: preserve-3d;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .planet-container:hover { transform: scale(1.3); z-index: 999; }

        .planet-content {
            width: 100%; height: 100%;
            /* Counter-rotation script handles face-forward */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .planet-avatar {
            width: 50px; height: 50px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0,243,255,0.5);
            transition: 0.3s;
        }
        .planet-container:hover .planet-avatar {
            border-color: var(--magenta); box-shadow: 0 0 25px var(--magenta);
        }

        .planet-name {
            font-size: 0.7rem; font-weight: 800; background: rgba(0,0,0,0.7);
            padding: 3px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
            margin-top: 5px; white-space: nowrap; transition: 0.3s;
            pointer-events: none;
        }
        .planet-container:hover .planet-name {
            color: var(--magenta); border-color: var(--magenta);
        }

        .center-sun {
            position: absolute; width: 100px; height: 100px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            border-radius: 50%; border: 3px solid var(--neon-purple);
            box-shadow: 0 0 50px rgba(188,19,254,0.6);
            object-fit: cover; z-index: 10;
        }

        /* Nexus Probe Styles */
        .nexus-active { z-index: 2000 !important; animation: none !important; }

        .biometric-scanner {
            position: absolute; top: -10px; left: 0; width: 100%; height: 3px;
            background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
            z-index: 100; pointer-events: none; opacity: 0;
        }
        @keyframes scanMove {
            0% { top: -10px; opacity: 1; }
            100% { top: 110%; opacity: 1; }
        }

        .telemetry-box {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            width: 150px; font-family: 'Orbitron', monospace; font-size: 0.6rem;
            color: var(--neon-blue); text-transform: uppercase; text-align: center;
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon-blue);
            padding: 5px; border-radius: 4px; opacity: 0; pointer-events: none;
            transition: 0.3s;
        }

        .satellite-container {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .satellite-node {
            position: absolute; width: 45px; height: 45px; border-radius: 50%;
            background: rgba(10,10,15,0.9); border: 2px solid var(--neon-blue);
            display: flex; align-items: center; justify-content: center; color: #fff;
            font-size: 0.9rem; cursor: pointer; transition: 0.4s; pointer-events: auto;
            opacity: 0; transform: scale(0);
        }
        .satellite-node:hover { transform: scale(1.2) !important; box-shadow: 0 0 20px var(--neon-blue); background: var(--neon-blue); color: #000; }
        .satellite-node i, .satellite-node svg { pointer-events: none; }

        #nexus-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 1500; opacity: 0; pointer-events: none; transition: 0.5s;
        }
        #nexus-overlay.active { opacity: 1; pointer-events: auto; }

        .btn-release {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.05); border: 1px solid #ff3333; color: #ff3333;
            padding: 10px 30px; border-radius: 30px; font-weight: 800; cursor: pointer;
            z-index: 2100; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .btn-release:hover { background: #ff3333; color: #fff; box-shadow: 0 0 20px rgba(255,51,51,0.4); }

        /* Fusion & Data Tiles */
        .sun-fusion { animation: sunPulse 0.5s infinite alternate !important; box-shadow: 0 0 100px #fff, 0 0 200px var(--neon-blue) !important; }
        @keyframes sunPulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: translate(-50%, -50%) scale(1.3); } }

        .data-tile {
            position: absolute; width: 80px; height: 80px; border-radius: 8px;
            overflow: hidden; border: 2px solid var(--neon-blue);
            cursor: pointer; transition: 0.5s cubic-bezier(1,0,0,1);
            filter: blur(8px); opacity: 0; transform-style: preserve-3d;
        }
        .data-tile:hover { filter: blur(0); transform: scale(1.4) !important; z-index: 10000 !important; box-shadow: 0 0 30px var(--neon-blue); }
        .data-tile img { width: 100%; height: 100%; object-fit: cover; }

        /* Lightbox */
        #explore-lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            z-index: 5000; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: 0.5s;
        }
        .lightbox-content {
            max-width: 80%; max-height: 80%; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .lightbox-img { max-width: 100%; max-height: 70vh; border-radius: 12px; border: 1px solid var(--neon-blue); box-shadow: 0 0 50px rgba(0,243,255,0.3); }
        .lightbox-caption { font-family: 'Orbitron'; font-size: 1rem; color: #fff; text-align: center; max-width: 600px; line-height: 1.6; }

    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const universe = document.getElementById("universe");
            const planets = document.querySelectorAll('.planet-container');
            const overlay = document.getElementById('nexus-overlay');
            const releaseBtn = document.getElementById('release-btn');
            const mainSun = document.getElementById('main-sun');
            const numPlanets = planets.length;

            if (numPlanets === 0) return;

            const rings = [200, 350, 500];
            let activePlanet = null;
            let fusionMode = false;

            planets.forEach((p, i) => {
                const ringIdx = i % 3;
                const radius = rings[ringIdx] + (Math.random() * 30 - 15);
                const angle = (i / numPlanets) * Math.PI * 2 * 3;
                const yOffset = (Math.random() - 0.5) * 150 * (ringIdx + 1);
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                p.style.transform = `translate3d(${x}px, ${yOffset}px, ${z}px)`;
                p.dataset.origX = x;
                p.dataset.origY = yOffset;
                p.dataset.origZ = z;

                p.addEventListener('click', (e) => {
                    if (activePlanet || fusionMode) return;
                    probeUser(p);
                });
            });

            function probeUser(p) {
                activePlanet = p;
                universe.style.animation = 'none';
                overlay.classList.add('active');
                releaseBtn.style.opacity = '1';
                releaseBtn.style.pointerEvents = 'auto';
                p.classList.add('nexus-active');

                // Move to center-front
                p.style.transition = '1s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                p.style.transform = `translate3d(0px, 0px, 400px) scale(2)`;

                const scanner = p.querySelector('.biometric-scanner');
                const telemetry = p.querySelector('.telemetry-box');

                setTimeout(() => {
                    scanner.style.animation = 'scanMove 2s linear forwards';
                    telemetry.style.opacity = '1';
                    runTelemetry(telemetry);
                }, 500);

                setTimeout(() => {
                    p.querySelectorAll('.satellite-node').forEach((node, i) => {
                        node.style.opacity = '1';
                        node.style.transform = 'scale(1)';
                        node.style.transitionDelay = `${i * 0.1}s`;
                    });
                }, 2500);
            }

            // Global Fusion Function
            window.fusionUser = (userId) => {
                if (fusionMode || !activePlanet) return;
                fusionMode = true;

                // 1. Shrink satellite nodes
                activePlanet.querySelectorAll('.satellite-node').forEach(node => {
                    node.style.transform = 'scale(0)';
                    node.style.opacity = '0';
                });

                // 2. Fusion Animation
                mainSun.classList.add('sun-fusion');
                activePlanet.style.transition = '1.5s cubic-bezier(0.7,0,0.3,1)';
                activePlanet.style.transform = `translate3d(0px, 0px, 0px) scale(0)`;
                activePlanet.style.opacity = '0';

                // 3. Fetch and Spill Data
                fetch(`/index/ajax_user_posts/${userId}/`)
                    .then(res => res.json())
                    .then(data => {
                        setTimeout(() => {
                            spillData(data.posts);
                            mainSun.classList.remove('sun-fusion');
                        }, 1500);
                    });
            };

            function spillData(posts) {
                posts.forEach((post, i) => {
                    const tile = document.createElement('div');
                    tile.className = 'data-tile';
                    tile.innerHTML = `<img src="${post.url}" title="${post.caption}">`;

                    const angle = (i / posts.length) * Math.PI * 2;
                    const radius = 180;
                    const tx = Math.cos(angle) * radius;
                    const tz = Math.sin(angle) * radius;
                    const ty = (Math.random() - 0.5) * 100;

                    tile.dataset.tx = tx;
                    tile.dataset.ty = ty;
                    tile.dataset.tz = tz;

                    universe.appendChild(tile);

                    // Animate spill out from sun
                    setTimeout(() => {
                        tile.style.opacity = '1';
                        tile.style.transform = `translate3d(${tx}px, ${ty}px, ${tz}px)`;
                    }, 10 + (i * 100));

                    tile.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openLightbox(post.url, post.caption);
                    });
                });
            }

            window.openLightbox = (src, caption) => {
                const lb = document.getElementById('explore-lightbox');
                document.getElementById('lb-img').src = src;
                document.getElementById('lb-cap').innerText = caption;
                lb.style.display = 'flex';
                setTimeout(() => lb.style.opacity = '1', 10);
            };

            window.closeLightbox = () => {
                const lb = document.getElementById('explore-lightbox');
                lb.style.opacity = '0';
                setTimeout(() => lb.style.display = 'none', 500);
            };

            releaseBtn.addEventListener('click', releaseUser);

            function releaseUser() {
                if (!activePlanet) return;

                const p = activePlanet;

                // Cleanup fusion tiles
                document.querySelectorAll('.data-tile').forEach(tile => {
                    tile.style.transform = 'translate3d(0,0,0) scale(0)';
                    tile.style.opacity = '0';
                    setTimeout(() => tile.remove(), 500);
                });

                fusionMode = false;
                p.style.opacity = '1';
                p.style.transform = `translate3d(${p.dataset.origX}px, ${p.dataset.origY}px, ${p.dataset.origZ}px) scale(1)`;

                setTimeout(() => {
                    p.classList.remove('nexus-active');
                    overlay.classList.remove('active');
                    releaseBtn.style.opacity = '0';
                    releaseBtn.style.pointerEvents = 'none';
                    activePlanet = null;
                    if (!isDragging) universe.style.animation = 'spinUniverse 120s linear infinite';
                }, 1000);
            }

            function runTelemetry(el) {
                const logs = ["INIT_SCAN...", "GATHERING_BIO...", "SIGNAL_LOCK...", "TRUST: 0.99", "ASSENT_VERIFIED", "NEXUS_READY"];
                let i = 0;
                const interval = setInterval(() => {
                    el.innerText = logs[i];
                    i++;
                    if (i >= logs.length) clearInterval(interval);
                }, 300);
            }

            let isDragging = false;
            let currentX = 0; let currentY = 0;
            let lastMouseX = 0; let lastMouseY = 0;

            document.addEventListener('mousedown', (e) => {
                if (activePlanet || e.target.closest('.planet-container') || e.target.closest('.btn-release')) return;
                isDragging = true;
                lastMouseX = e.clientX; lastMouseY = e.clientY;
                universe.style.animation = 'none';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                if (!activePlanet) universe.style.animation = 'spinUniverse 120s linear infinite';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging || activePlanet) return;
                currentX += (e.clientY - lastMouseY) * 0.3;
                currentY += (e.clientX - lastMouseX) * 0.3;
                currentX = Math.max(-80, Math.min(80, currentX));
                universe.style.transform = `rotateX(${-currentX}deg) rotateY(${currentY}deg)`;
                updatePlanetRotations();
                lastMouseX = e.clientX; lastMouseY = e.clientY;
            });

            function updatePlanetRotations() {
                const angleY = currentY;
                const angleX = currentX;
                document.querySelectorAll('.planet-content, .data-tile').forEach(content => {
                    content.style.transform = `rotateY(${-angleY}deg) rotateX(${angleX}deg)`;
                });
            }

            function animateLoop() {
                if (!isDragging && !activePlanet) {
                    const matrix = new DOMMatrix(window.getComputedStyle(universe).transform);
                    const angleY = Math.atan2(matrix.m13, matrix.m11) * (180 / Math.PI);
                    document.querySelectorAll('.planet-content').forEach(c => c.style.transform = `rotateY(${-angleY}deg)`);
                }
                requestAnimationFrame(animateLoop);
            }
            setTimeout(animateLoop, 500);
        });
    </script>
