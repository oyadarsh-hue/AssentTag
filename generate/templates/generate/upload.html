<html>
  <body>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="file" name="photo" />
      <input type="submit" value="Upload" />
    </form>
    {% if uploaded_file_url %}
    <img src="/static/{{photo}}" />
    <img src="/static/{{uploaded_file_url}}" />
    {% endif %}
  </body>
</html>
