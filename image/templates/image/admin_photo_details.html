<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AssentTag - User Photo Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Modern Reset and Base Styles - Dark Mode */
        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0a;
            --text-main: #ffffff;
            --text-secondary: #a3a3a3;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color) !important;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Overriding the deprecated bgcolor/text attributes */
        body[bgcolor] {
            background-color: var(--bg-color) !important;
            color: var(--text-main) !important;
        }

        /* Header Styling - Dark */
        table[width="100%"] {
            background: #111111 !important;
            border-bottom: 1px solid #333;
            padding: 1rem 2rem;
            width: 100%;
            border-spacing: 0;
        }

        font[size="6"] {
            font-size: 1.5rem !important;
            font-weight: 800;
            color: #ffffff !important;
            letter-spacing: -0.025em;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Button Styling - Unique & Vibrant */
        button {
            border: none;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
        }

        /* Secondary "Back" Button - "Solar Flare" */
        table[width="100%"] button {
            background: linear-gradient(135deg, #FFD700 0%, #FF4500 100%);
            /* Gold to Orange Red */
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.4);
        }

        table[width="100%"] button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        a {
            text-decoration: none;
        }

        hr {
            border: 0;
            height: 1px;
            background: #333;
            margin: 0;
        }

        /* Main Content Container Styling - Dark Card */
        center>table {
            background: #111111 !important;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            margin-top: 3rem;
            width: 1000px !important;
            /* Wider for the table */
            border: 1px solid #333 !important;
            max-width: 95%;
        }

        h2 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            border-left: 4px solid #00FFFF;
            /* Cyan accent */
            padding-left: 12px;
            display: inline-block;
        }

        p {
            color: #a3a3a3;
            margin-top: 0;
        }

        /* Structured Data Table Styling */
        table[border="1"] {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #333;
            margin-top: 2rem;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }

        table[border="1"] th {
            background: #222;
            color: #fff;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #FF00FF;
            /* Neon pink accent line */
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        table[border="1"] td {
            padding: 1rem;
            border-bottom: 1px solid #333;
            color: #ccc;
            font-size: 0.95rem;
        }

        table[border="1"] tr:last-child td {
            border-bottom: none;
        }

        table[border="1"] tr:hover td {
            background-color: #2a2a2a;
            color: #fff;
        }

        /* Footer */
        font[color="#999999"] {
            color: #444 !important;
            font-weight: 500;
        }
    </style>
</head>

<body bgcolor="#f4f4f4" text="#333333">

    <!-- Header Table -->
    <table width="100%" border="0" cellpadding="10" bgcolor="#ffffff">
        <tr>
            <td align="left">
                <font size="6" face="Arial, sans-serif" color="#222222">
                    <strong>User Photo Details</strong>
                </font>
            </td>
            <td align="right">
                <a href="admin-dashboard.html"><button>Back to Admin Home</button></a>
            </td>
        </tr>
    </table>

    <hr color="#dddddd" size="1">

    <br><br>

    <!-- Main Content -->
    <center>
        <table width="1000" border="0" cellpadding="20" bgcolor="#ffffff">
            <tr>
                <td align="center">
                    <font face="Arial, sans-serif">

                        <div style="text-align: left; padding: 0 1rem;">
                            <h2>User Photo Information</h2>
                            <p>Review photo details and metadata.</p>
                        </div>

                        <!-- Structured Table -->
                        <div style="padding: 10px; overflow-x: auto;">
                            <table border="1">
                                <tr>
                                    <th>image_id</th>
                                    <th>register_id</th>
                                    <th>date</th>
                                    <th>time</th>
                                    <th>photo</th>
                                    <th>visibility</th>
                                </tr>

                                {% for j in a %}
                                <tr>
                                    <td>{{ j.image_id }}</td>
                                    <td>{{ j.register_id }}</td>
                                    <td>{{ j.date }}</td>
                                    <td>{{ j.time }}</td>
                                    <td>{{ j.photo }}</td>
                                    <td>{{ j.visibility }}</td>
                                </tr>
                                {% endfor %}
                            </table>
                        </div>

                    </font>
                </td>
            </tr>
        </table>
    </center>

    <br><br>
    <font face="Arial" size="1" color="#999999">
        <center>&copy; 2026 AssentTag Systems</center>
    </font>

</body>

</html>
